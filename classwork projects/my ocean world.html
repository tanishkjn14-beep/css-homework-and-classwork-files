<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my ocean world</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            color: #063b52;
            background-color: lightblue;
            font-family: Arial, Helvetica, sans-serif;
        }
    .navbar{
        background: linear-gradient(90deg, #023E5A, #0077B6);
        color: whitesmoke;
    }

    .buble{
        background: linear-gradient(135deg, #0077B6, #00B4D8);
        width: 100%;
        height: 250px;
        text-align: center;
        position: relative;
        z-index: 1;
        
    }

     .bubble1{
        left: 50px;
         border-radius: 50%;
        width: 50px;
        height: 50px;
        border: 5px solid white;
        position: fixed;
        animation: bubble 5s ease-in infinite;
        bottom: 20px;
        
     }

  .bubble2{
    left: 350px;
    height: 30px;
    width: 30px;
    position: absolute;
     border-radius: 50%;
        width: 50px;
        height: 50px;
        border: 2px solid white;
        position: fixed;
        animation: bubble 7s ease-in infinite;
        bottom: 60px;
  }

  
  .bubble3{
    left: 640px;
    height: 70px;
    width: 70px;
    position: absolute;
     border-radius: 50%;
        width: 50px;
        height: 50px;
        border: 6px solid white;
        position: fixed;
        animation: bubble 3s ease-in infinite;
        bottom: 80px;
  }

    .bubble4{
    left: 900px;
    height: 20px;
    width: 20px;
    position: absolute;
     border-radius: 50%;
        width: 50px;
        height: 50px;
        border: 4px solid white;
        position: fixed;
        animation: bubble 6s ease-in infinite;
        bottom: 120px;
  }

      .bubble5{
    left: 1100px;
    height: 80px;
    width: 80px;
    position: absolute;
     border-radius: 50%;
        width: 50px;
        height: 50px;
        border: 7px solid white;
        position: fixed;
        animation: bubble 8s ease-in infinite;
        bottom: 150px;
  }

  .bubble6{
    left: 1300px;
    height: 90px;
    width: 90px;
    position: absolute;
     border-radius: 50%;
        width: 50px;
        height: 50px;
        border: 1px solid white;
        position: fixed;
        animation: bubble 9s ease-in infinite;
        bottom: 180px;
  }

  @keyframes bubble{
                      from{bottom: -50px;}
                      to{bottom: 100vh;}
  }

  .card{
    text-align: center;
    background-color:lightskyblue;
    color: black;
    text-decoration: bold;
    border: 1px solid black;
  }

  .cardfooter{
    text-align: center;
    background-color:lightgreen;
    color: whitesmoke;
    text-decoration: bolder;
    border: 0px;
  }
    </style>
</head>
<body>
    <navbar class="navbar"><div><h3 style="padding-left: 100px;">🌊 ocean world</h3></div></navbar>
    <div class="buble">

        <h1 style="padding-top: 30px;">🌊 My Ocean World</h1><br>
        <h3 style="color: whitesmoke;">Explore the amazing world beneath the waves.</h3><br>
        <div class="btn btn-light">CLICK HERE TO EXPLORE MORE</div>
        
        <div class="bubble1"></div>
        <div class="bubble2"></div>
        <div class="bubble3"></div>
        <div class="bubble4"></div>
        <div class="bubble5"></div>
        <div class="bubble6"></div>
        
    </div><br><br>

    <div class="card">
        <h4>Loading</h4><br>
        <div class="d-flex justify-content-center align-items-center">
    <div class="spinner-border text-primary">

    </div>
</div>
    </div><br><br>

     <div class="card">
        <h4>🐬Dolphins</h4><br>
        <p>Dolphins are intelligent and friendly sea animals.</p>
        </div><br><br><br>

        <footer>
              <div class="card footer">
        <h4>Made by:</h4>
        <p>Tanishk Jain</p>
        </div>
        </footer>
</body>
</html>
