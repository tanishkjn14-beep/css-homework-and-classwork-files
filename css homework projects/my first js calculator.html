<p id="add"></p><br>
<p id="div"></p><br>
<p id="mul"></p><br>
<p id="sub"></p><br>
<p id="remainder"></p>  

<h1>Note: if it shows NaN than it is the problem in the values given or that is the answer only.</h1>

 <footer>

    <script>
        var num1 = Number((prompt("provide the first number")));
        var num2 = Number((prompt("provide the second number")));
         var num3 = Number((prompt("provide the last number (optional)")));

        var add = num1 + num2 + num3;
        var div = num1 / num2 / num3;
        var multiply = num1 * num2 * num3;
        var sub = num1 - num2 - num3;
        var remainder = num1 % num2 % num3;

        document.getElementById("add").innerHTML = "The answer after adding is: " + add;
        document.getElementById("sub").innerHTML = "The answer after subtracting them is: " + sub;
        document.getElementById("mul").innerHTML = "The answer after multiplying is: " + multiply;
        document.getElementById("div").innerHTML = "The answer after dividing them is: " + div;
        document.getElementById("remainder").innerHTML = "The remainder after dividing is: " + remainder;
    </script>
