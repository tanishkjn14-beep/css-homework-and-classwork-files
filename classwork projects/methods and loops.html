
<!DOCTYPE html>
<html>
<head>
  <title>Methods and Loops</title>
</head>
<body>

  <h2>Methods and Loops</h2>
  <p>Numbers from 1 to 10</p>
  <p id="numbers"></p>
  <p id="random"></p>
  <p id="day"></p>

  <script>
    let text = "";

    for (let i = 1; i <= 10; i++) {
      text = text + i + "<br>";
    }

    document.getElementById("numbers").innerHTML = text;

    let num = Math.floor(Math.random() * 100);
    document.getElementById("random").innerHTML = "The random number is " + num;

    let day = new Date().getDay();
    document.getElementById("day").innerHTML = "Today's day number is " + day;
  </script>

</body>
</html>
