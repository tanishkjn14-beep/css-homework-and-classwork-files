<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my hobby cards</title>
    <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    

    <style>
        body{
            background-color: whitesmoke;
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px 15px;
        }

        h1{
            text-align: center;
            color: rgba(240, 126, 11, 0.832);
        }

        .hobby-card{
            text-align: center;
            border: 2px dashed #ff5a43;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #fff8e1;
        }

        .hobby-card h3{
            color: #ff5a43;
        }

        h3:hover{
            color: yellow;
            font-size: 50px;
        }

        p:hover{
            color: red;
        }

        h2:hover{
            color: orange;
        }

        h2{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>My hobby cards</h1><br><br>

    <div class="container">
        <div class="row">
            <div class="col-sd-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>studying</h3>
                    <P>I love studying science and solve complex problem of Maths.</P>
                </div>
        </div>

        <div class="col-sd-12 col-md-6 col-lg-4">
            <div class="hobby-card">
                <h3>football</h3>
                <p>i play football every evening with my friends.</p>
            </div>
        </div>

        <div class="col-sd-12 col-md-6 col-lg-4">
            <div class="hobby-card">
                <h3>reading</h3>
                <p>my favourite books are adventure stories.</p>
            </div>
        </div>
    </div>

    <footer>
        <h2>Made by tanishk jain</h2>
    </footer>

    <script src=" https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

    </script>
</body>
</html>
