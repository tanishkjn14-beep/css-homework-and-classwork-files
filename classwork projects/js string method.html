<!DOCTYPE html>
<html lang="en">
<head>
    <title>js string methods</title>
</head>
<body>
   <h2>javascript string methods</h2>
   <p>basic methods</p>
   <script>
    var str = "AmAzInG";
     var str1 = "I learnt about methods";
    document.write(str.toUpperCase());
    document.write("<br>");
    document.write(str.toLowerCase());
    document.write("<br>");
    document.write(str1.startsWith("I"));
    document.write("<br>");
    
    var patt = new RegExp("about");
    var res = patt.test(str1);
    document.write(res);
   </script>
</body>
</html>
