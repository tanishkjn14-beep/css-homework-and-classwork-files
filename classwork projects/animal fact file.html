<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal fact file</title>
    <style>
        body {
            background-color: darkgreen;
            font-family: arial;
        }

        .fact-file {
            background-color: lightyellow;
            color: darkslategray;
            width: 260px;
            padding: 25px;
            border: 4px dashed forestgreen;
            margin: 30px;
        }

        .animal-name{
            color: forestgreen;
            font-size: 22px;
        }

        .detail{
            color: darkslategray;
        }

        .cool-fact{
            color: darkorange;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="fact-file">
        <h2 class="animal-name">snow leapord</h2>
        <p class="detail">Type: Big Cat</p>
        <p class="detail">Lives in: mountain ranges of central asia</p>
        <p class="detail">diet: deer, goats, and wild sheep</p>
        <p class="cool-fact">cool fact: can leap up to 15 meteres in one jump!</p>
    </div>
</body>
</html>
