<!DOCTYPE html>
<html>
<head>
    <title>My Ice Cream Shop Menu</title>

    <style>

        body{
            background-color:#fff8dc;
            font-family:Arial;
        }

        h1{
            text-align:center;
            color:darkred;
        }

        h2{
            color:green;
        }

        p{
            font-size:18px;
        }

        ul{
            background:white;
            border:2px solid brown;
            width:300px;
            padding:15px;
        }

        li{
            padding:8px;
        }

        
        ul > li{
            color:blue;
        }

        
        h2 + p{
            color:purple;
        }

        h2 ~ ul{
            background:#fff0f5;
        }

        
        input[type="text"]{
            border:2px solid red;
            padding:5px;
        }

        
        li:hover{
            background:yellow;
            color:red;
        }

       
        li:first-child{
            font-weight:bold;
            color:green;
        }

        li:last-child{
            color:brown;
        }

        
        p::first-letter{
            font-size:30px;
            color:red;
        }

   
        h1::before{
            content:"🍦 ";
        }

        
        h1::after{
            content:" 🍨";
        }

    </style>

</head>

<body>

<h1>My Ice Cream Shop Menu</h1>

<h2>Today's Special Flavours</h2>

<p>Welcome to our colourful ice cream shop. Enjoy fresh and delicious ice creams.</p>

<ul>
    <li>Chocolate - ₹60</li>
    <li>Vanilla - ₹50</li>
    <li>Strawberry - ₹70</li>
    <li>Mango - ₹65</li>
    <li>Butterscotch - ₹75</li>
</ul>

<h2>Customer Details</h2>

<p>Please enter your name.</p>

<input type="text" placeholder="Enter your name"><br><br>


    <centre>
    <h3>Made by Tanishk jain</h3>
    </centre>


</body>
</html>
