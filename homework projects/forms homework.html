<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>

    <style>
        h2{
            text-align:center;
        }

        label{
            font-weight:bold;
        }

        input{
            height:25px;
        }

        select{
            height:30px;
            width:60px;
        }

        body{

              background-color: rgb(167, 196, 194);
        }


    </style>
</head>

<body>

<font size="15px"; style="color: rgb(119, 51, 68);"><marquee scrollamount="10"><b><h1>Student Form</h1></b></marquee></font><br>

<marquee scrollamount="10" style="color:rgb(9,56,36); font-size:30px;">
    <b>⚠️ Please fill out the form below ⚠️</b>
</marquee>
<form>
<center>
<label>Name:</label><br>
<input type="text" name="name"><br><br>

<label>Age:</label><br>
<input type="number" name="age"><br><br>

<label>Email:</label><br>
<input type="email" name="email"><br><br>

<label>Password:</label><br>
<input type="password" name="password"><br><br>

<label>Gender:</label><br>
<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="gender" value="Female"> Female
<br><br>

<label>Class:</label><br>
<select name="class">
    <option>7</option>
    <option>8</option>
    <option>9</option>
</select>
<br><br>

<label>Hobby:</label><br>
<input type="checkbox" name="hobby" value="Reading"> Reading
<input type="checkbox" name="hobby" value="Sports"> Sports
<input type="checkbox" name="hobby" value="Music"> Music
<br><br>

<input type="submit" value="Submit">

</form>

</center>
</body>
</html>
