
<!DOCTYPE html>
<html>
<head>
  <title>Superhero Power Cards</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f0f4ff;
    }
    h1 { color: #e63946; }
    .cards {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .card {
      background: white;
      border: 2px solid #e63946;
      border-radius: 10px;
      padding: 15px;
      width: 200px;
    }
    .power { color: #0057b8; font-weight: bold; }
  </style>
</head>
<body>

  <h1>🦸 Superhero Power Cards</h1>
  <p>Meet our amazing superheroes!</p>

  <div class="cards">
    <div class="card">
      <h3>Captain Code</h3>
      <p class="power">Power: Fixing Bugs</p>
      <p>Mission: Save programs.</p>
    </div>

    <div class="card">
      <h3>Pixel Flash</h3>
      <p class="power">Power: Fast Designing</p>
      <p>Mission: Build websites.</p>
    </div>

    <div class="card">
      <h3>Data Knight</h3>
      <p class="power">Power: Data Safety</p>
      <p>Mission: Protect information.</p>
    </div>
  </div>

</body>
</html>
